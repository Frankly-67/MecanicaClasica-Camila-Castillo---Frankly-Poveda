<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>escena</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="datos.js"></script><script src="mision.js"></script>
</head><body><canvas id="c" width="1280" height="720"></canvas>
<script>
"use strict";
const W=1280,H=720, cv=document.getElementById("c"), g=cv.getContext("2d");
const FONT="Inter, 'DejaVu Sans', sans-serif", MONO="'DejaVu Sans Mono', monospace";
const D=window.DATOS, M=window.MISION;
const COL={probe:"#ffb454",jup:"#5ad1e6",keep:"#7bd88f",chg:"#ff7a95",text:"#eef2ff",mut:"#a9b4d6",line:"#2c3a6b"};
const MU=D.constantes.GM_J, RJ=D.constantes.RJ, RSOI=D.constantes.rSOI_RJ*RJ, NJ=D.constantes.n;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t, ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const fmt=(x,n=2)=>x.toFixed(n);

/* ---------- ruido y sprites procedurales ---------- */
function hash(x,y){let h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(hash(xi,yi),hash(xi+1,yi),u),lerp(hash(xi,yi+1),hash(xi+1,yi+1),u),v);}
function fbm(x,y,o=4){let a=.5,s=0,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);f*=2;a*=.5;}return s;}
function mix(c1,c2,t){return [lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)];}
function sphere(S,fn){const c=document.createElement("canvas");c.width=c.height=S;const x=c.getContext("2d"),im=x.createImageData(S,S);
  for(let j=0;j<S;j++)for(let i=0;i<S;i++){const u=(i+.5)/S*2-1,v=(j+.5)/S*2-1,r2=u*u+v*v,k=(j*S+i)*4;
    if(r2>=1){im.data[k+3]=0;continue;} const z=Math.sqrt(1-r2),col=fn(u,v,z);const a=clamp((1-Math.sqrt(r2))*S*.5,0,1);
    im.data[k]=col[0];im.data[k+1]=col[1];im.data[k+2]=col[2];im.data[k+3]=255*a;}
  x.putImageData(im,0,0);return c;}
const SP={};
function spr(name){ if(SP[name]) return SP[name]; let c;
  if(name==="jupiter") c=sphere(360,(u,v,z)=>{ const lat=Math.asin(v), t=fbm(u*2.2+3,v*9+lat*2,4), band=.5+.5*Math.sin(lat*10.5+t*3.2+fbm(u*1.2,v*3,2)*2);
    const pal=[[236,222,196],[206,168,128],[160,112,80],[190,110,70]];
    let col=band<.35?mix(pal[2],pal[1],band/.35):band<.7?mix(pal[1],pal[0],(band-.35)/.35):mix(pal[0],pal[3],(band-.7)/.3*.6);
    const ux=(u-.28)/.2, vy=(v-.34)/.1, d=ux*ux+vy*vy; if(d<1){ const k=1-d; col=mix(col,[196,84,58],clamp(k*1.6,0,1)); if(d>.7) col=mix(col,[235,205,180],.35);}
    const tt=.9+.2*fbm(u*8,v*16,3); return [col[0]*tt,col[1]*tt,col[2]*tt]; });
  else if(name==="saturn") c=sphere(360,(u,v,z)=>{ const lat=Math.asin(v), t=fbm(u*2+9,v*8,3), b=.5+.5*Math.sin(lat*14+t*2);
    const col=mix([222,200,150],[198,170,120],b); const tt=.92+.12*t; return [col[0]*tt,col[1]*tt,col[2]*tt]; });
  else if(name==="earth") c=sphere(240,(u,v,z)=>{ const n=fbm(u*2.4+5,v*2.4+2,5); let col; if(Math.abs(v)>.88) col=[238,243,250]; else if(n>.53) col=mix([62,130,70],[150,130,90],clamp((n-.53)*5,0,1)); else col=mix([20,70,150],[34,110,185],n/.53);
    const cl=fbm(u*4+20,v*4+9,4); if(cl>.58) col=mix(col,[255,255,255],clamp((cl-.58)*4,0,.85)); return col; });
  else if(name==="sun") c=sphere(300,(u,v,z)=>{ const n=fbm(u*9,v*9,4); const lim=Math.pow(z,.5); return [255,lerp(150,235,lim)*(.92+.1*n),lerp(40,150,lim)*(.9+.15*n)]; });
  else if(name==="io") c=sphere(120,(u,v,z)=>{ const n=fbm(u*5,v*5,4); let col=mix([232,208,110],[210,160,70],n); if(n>.62) col=mix(col,[180,70,40],.6); return col; });
  else if(name==="europa") c=sphere(120,(u,v,z)=>{ const n=fbm(u*6,v*6,3); let col=mix([236,230,216],[210,190,160],n); if(Math.abs(fbm(u*9,v*9,2)-.5)<.03) col=[150,100,80]; return col; });
  else if(name==="ganymede") c=sphere(120,(u,v,z)=>{ const n=fbm(u*5+4,v*5,4); return mix([150,134,118],[196,186,172],n); });
  else if(name==="callisto") c=sphere(120,(u,v,z)=>{ const n=fbm(u*7+8,v*7,4); let col=mix([78,70,64],[120,110,100],n); if(vnoise(u*14,v*14)>.9) col=[200,196,190]; return col; });
  SP[name]=c; return c; }
function planet(name,x,y,r,light){ // light: ángulo (rad) hacia el Sol
  const s=spr(name); g.save(); g.drawImage(s,x-r,y-r,2*r,2*r); g.beginPath(); g.arc(x,y,r,0,7); g.clip();
  if(light!==undefined){ const dx=Math.cos(light), dy=Math.sin(light); const gr=g.createLinearGradient(x+dx*r*.25,y+dy*r*.25,x-dx*r*1.05,y-dy*r*1.05);
    gr.addColorStop(0,"rgba(0,0,12,0)"); gr.addColorStop(1,"rgba(0,0,12,.82)"); g.fillStyle=gr; g.fillRect(x-r,y-r,2*r,2*r); }
  const rg=g.createRadialGradient(x,y,r*.55,x,y,r); rg.addColorStop(0,"rgba(0,0,10,0)"); rg.addColorStop(1,"rgba(0,0,10,.45)"); g.fillStyle=rg; g.fillRect(x-r,y-r,2*r,2*r);
  g.restore(); }
function saturn(x,y,r,light){ const tilt=.38; g.save();
  const ring=(front)=>{ for(const [a,b,al] of [[1.25,1.5,.55],[1.55,1.8,.8],[1.85,2.2,.35]]){ g.beginPath(); g.ellipse(x,y,r*(a+b)/2,r*(a+b)/2*tilt,-.18,front?0:Math.PI,front?Math.PI:2*Math.PI);
      g.strokeStyle=`rgba(224,205,160,${al})`; g.lineWidth=r*(b-a)*.9; g.stroke(); } };
  ring(false); planet("saturn",x,y,r,light); ring(true); g.restore(); }
function sunGlow(x,y,r){ const gr=g.createRadialGradient(x,y,r*.6,x,y,r*5); gr.addColorStop(0,"rgba(255,200,90,.55)"); gr.addColorStop(.25,"rgba(255,150,40,.18)"); gr.addColorStop(1,"rgba(255,120,20,0)");
  g.fillStyle=gr; g.fillRect(x-r*5,y-r*5,r*10,r*10); planet("sun",x,y,r); }
function probe(x,y,ang,sz=1){ g.save(); g.translate(x,y); g.rotate(ang);
  const gl=g.createRadialGradient(0,0,0,0,0,16*sz); gl.addColorStop(0,"rgba(255,190,90,.9)"); gl.addColorStop(1,"rgba(255,180,80,0)"); g.fillStyle=gl; g.fillRect(-16*sz,-16*sz,32*sz,32*sz);
  g.fillStyle="#fff1d6"; g.fillRect(-4*sz,-2.5*sz,8*sz,5*sz); g.strokeStyle="#ffd9a0"; g.lineWidth=1.5*sz;
  g.beginPath(); g.moveTo(-4*sz,0); g.lineTo(-10*sz,0); g.stroke(); g.beginPath(); g.arc(5*sz,0,3.2*sz,-1.2,1.2); g.stroke(); g.restore(); }

/* ---------- fondo ---------- */
let BG; function fondo(){ if(!BG){ BG=document.createElement("canvas"); BG.width=W; BG.height=H; const x=BG.getContext("2d");
    const gr=x.createRadialGradient(W*.35,H*.4,50,W*.5,H*.5,W*.8); gr.addColorStop(0,"#0f1a3d"); gr.addColorStop(.6,"#080d22"); gr.addColorStop(1,"#03050f"); x.fillStyle=gr; x.fillRect(0,0,W,H);
    for(const [cx,cy,r,c] of [[220,520,330,"rgba(90,60,160,.16)"],[980,160,300,"rgba(40,110,170,.14)"],[640,700,380,"rgba(150,60,110,.08)"]]){ const n=x.createRadialGradient(cx,cy,0,cx,cy,r); n.addColorStop(0,c); n.addColorStop(1,"rgba(0,0,0,0)"); x.fillStyle=n; x.fillRect(0,0,W,H); }
    for(let i=0;i<650;i++){ const a=hash(i,1.3),b=hash(i,7.7),s=hash(i,3.1); x.fillStyle=`rgba(${200+55*hash(i,9)|0},${210+40*hash(i,4)|0},255,${.25+.6*s})`; x.beginPath(); x.arc(a*W,b*H,.4+1.3*s*s,0,7); x.fill(); } }
  g.drawImage(BG,0,0); }
function twinkle(t){ for(let i=0;i<40;i++){ const a=hash(i,21.1),b=hash(i,5.5); g.fillStyle=`rgba(255,255,255,${.25+.35*Math.sin(t*2+i*1.7)})`; g.beginPath(); g.arc(a*W,b*H,1.1,0,7); g.fill(); } }

/* ---------- utilidades de dibujo ---------- */
function panel(x,y,w,h,title){ g.save(); g.fillStyle="rgba(8,13,34,.80)"; g.strokeStyle="rgba(120,140,220,.28)"; g.lineWidth=1; rr(x,y,w,h,12); g.fill(); g.stroke(); g.restore();
  if(title){ txt(title,x+14,y+24,"500 15px "+FONT,COL.mut); } }
function rr(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function txt(s,x,y,font,col,al="left"){ g.font=font; g.fillStyle=col; g.textAlign=al; g.fillText(s,x,y); }
function poly(pts,col,wd,dash){ if(pts.length<2) return; g.beginPath(); g.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) g.lineTo(pts[i][0],pts[i][1]); g.strokeStyle=col; g.lineWidth=wd; g.setLineDash(dash||[]); g.lineJoin="round"; g.stroke(); g.setLineDash([]); }
function dot(x,y,r,c){ g.beginPath(); g.arc(x,y,r,0,7); g.fillStyle=c; g.fill(); }
function arrow(x0,y0,x1,y1,col,wd=3){ const a=Math.atan2(y1-y0,x1-x0); poly([[x0,y0],[x1,y1]],col,wd); g.beginPath(); g.moveTo(x1,y1); g.lineTo(x1-12*Math.cos(a-.4),y1-12*Math.sin(a-.4)); g.lineTo(x1-12*Math.cos(a+.4),y1-12*Math.sin(a+.4)); g.closePath(); g.fillStyle=col; g.fill(); }
function wrap(s,maxw,font){ g.font=font; const words=s.split(" "),lines=[]; let cur=""; for(const w of words){ const t=cur?cur+" "+w:w; if(g.measureText(t).width>maxw&&cur){lines.push(cur);cur=w;} else cur=t; } if(cur) lines.push(cur); return lines; }
function fit(bb,x0,y0,w,h,m=0){ const s=Math.min((w-2*m)/(bb.x1-bb.x0),(h-2*m)/(bb.y1-bb.y0)), cx=(bb.x0+bb.x1)/2, cy=(bb.y0+bb.y1)/2; return {s,X:x=>x0+w/2+(x-cx)*s,Y:y=>y0+h/2-(y-cy)*s}; }
function fecha(d0,dias){ const t=Date.UTC(1977,8,3)+dias*86400000, f=new Date(t); const m=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"]; return f.getUTCDate()+" "+m[f.getUTCMonth()]+" "+f.getUTCFullYear(); }
// gráfica genérica
function graph(R,o){ panel(R.x,R.y,R.w,R.h,o.title); const L=R.x+54,Rr=R.x+R.w-16,T=R.y+40,B=R.y+R.h-46;
  const X=x=>L+(x-o.x0)/(o.x1-o.x0)*(Rr-L), Y=o.log?(y=>T+(Math.log10(o.y1)-Math.log10(Math.max(y,o.y0)))/(Math.log10(o.y1)-Math.log10(o.y0))*(B-T)):(y=>T+(o.y1-y)/(o.y1-o.y0)*(B-T));
  g.save(); g.beginPath(); g.rect(R.x,R.y,R.w,R.h); g.clip();
  for(const v of o.yt){ poly([[L,Y(v)],[Rr,Y(v)]],"rgba(120,140,220,.16)",1); txt(o.yf?o.yf(v):String(v),L-8,Y(v)+5,"13px "+MONO,COL.mut,"right"); }
  for(const v of o.xt){ txt(String(v),X(v),B+20,"13px "+MONO,COL.mut,"center"); poly([[X(v),B],[X(v),B+4]],COL.mut,1); }
  if(o.xlabel) txt(o.xlabel,(L+Rr)/2,R.y+R.h-9,"12px "+FONT,COL.mut,"center");
  for(const s of (o.bands||[])){ g.fillStyle=s.c; g.fillRect(X(s.a),T,Math.max(2,X(s.b)-X(s.a)),B-T); }
  for(const h of (o.hlines||[])){ poly([[L,Y(h.y)],[Rr,Y(h.y)]],h.c,1.6,[6,5]); txt(h.t,L+6,Y(h.y)-6,"12px "+FONT,h.c); }
  for(const s of o.series){ const n=Math.min(s.n??s.x.length, s.x.length); const pts=[]; for(let i=0;i<n;i++) pts.push([X(s.x[i]),Y(s.y[i])]);
    poly(pts,s.c,s.w||3,s.d); if(n>0&&s.dot!==false){ const p=pts[n-1]; dot(p[0],p[1],5,s.c);} }
  g.restore(); return {X,Y,L,Rr,T,B}; }

/* ---------- elementos comunes (título, subtítulo) ---------- */
function cabecera(titulo){ txt("Reto III.3 · Mecánica Clásica 2026-B · UIS",32,34,"500 15px "+FONT,COL.mut); txt(titulo,32,70,"700 30px "+FONT,COL.text); }
function subtitulo(s){ const lines=wrap(s,1150,"500 22px "+FONT), h=lines.length*30+20, y=H-h-22; g.save(); g.fillStyle="rgba(4,7,20,.86)"; rr(40,y,1200,h,14); g.fill(); g.restore();
  lines.forEach((l,i)=>txt(l,W/2,y+32+i*30,"500 22px "+FONT,COL.text,"center")); }
function tarjetaTitulo(c,u){ const a=1; g.save(); planet("jupiter",1010,560,420,-2.2); g.restore();
  g.fillStyle="rgba(3,5,15,.55)"; g.fillRect(0,0,W,H);
  txt("Reto III.3 · Mecánica Clásica 2026-B · UIS",80,230,"500 20px "+FONT,COL.mut);
  const ls=wrap(c.titulo,760,"700 66px "+FONT); ls.forEach((l,i)=>txt(l,80,320+i*74,"700 66px "+FONT,COL.text));
  const y2=320+ls.length*74; wrap(c.sub,700,"400 26px "+FONT).forEach((l,i)=>txt(l,80,y2+10+i*36,"400 26px "+FONT,COL.jup));
  txt("Poveda Pinzón y Castillo López",80,y2+120,"500 20px "+FONT,COL.mut); }

/* ================= CLIP 1: MISIÓN ================= */
function clipMision(q,beat,tt,c){
  const cx=430, cy=332, s=29, N=M.dias.length, i=clamp(Math.round(q*(N-1)),0,N-1);
  // órbitas
  for(const [r,n] of [[1,"Tierra"],[5.2029,"Júpiter"],[9.5367,"Saturno"]]){ g.beginPath(); g.arc(cx,cy,r*s,0,7); g.strokeStyle="rgba(150,170,240,.55)"; g.lineWidth=1.4; g.setLineDash([3,6]); g.stroke(); g.setLineDash([]); }
  txt("1 UA",cx+s+4,cy-6,"12px "+MONO,COL.mut); txt("5.2 UA",cx+5.2*s*.72,cy-5.2*s*.72-6,"12px "+MONO,COL.mut); txt("9.5 UA",cx+9.5*s*.72,cy-9.5*s*.72-6,"12px "+MONO,COL.mut);
  // Hohmann
  if(c.beats[beat].id==="hohmann"||c.beats[beat].id==="resumen"){ const e0=M.tierra[0], ph=Math.atan2(e0[1],e0[0]), a=(1+9.5367)/2, e=(9.5367-1)/(9.5367+1); const pts=[];
    for(let k=0;k<=120;k++){ const th=Math.PI*k/120, r=a*(1-e*e)/(1+e*Math.cos(th)); pts.push([cx+r*s*Math.cos(ph+th),cy-r*s*Math.sin(ph+th)]); }
    const upto=c.beats[beat].id==="hohmann"?Math.round(120*ease(clamp(tt/(c.beats[beat].dur*.8),0,1))):120; poly(pts.slice(0,upto+1),"#ff7a95",2.4,[8,6]);
    if(upto>60) txt("Hohmann: 6.05 años",cx+4*s*Math.cos(ph+2.2),cy-4*s*Math.sin(ph+2.2),"600 16px "+FONT,"#ff9bb0","center"); }
  // sonda
  poly(M.sonda.slice(0,i+1).map(p=>[cx+p[0]*s,cy-p[1]*s]),COL.probe,3);
  sunGlow(cx,cy,17);
  const P=(a)=>[cx+a[0]*s,cy-a[1]*s]; const e=P(M.tierra[i]),j=P(M.jupiter[i]),sa=P(M.saturno[i]);
  planet("earth",e[0],e[1],9,Math.atan2(cy-e[1],cx-e[0])); planet("jupiter",j[0],j[1],17,Math.atan2(cy-j[1],cx-j[0])); saturn(sa[0],sa[1],11,Math.atan2(cy-sa[1],cx-sa[0]));
  txt("Tierra",e[0]+12,e[1]+16,"13px "+FONT,"#9cc9ff"); txt("Júpiter",j[0]+20,j[1]+4,"13px "+FONT,COL.jup); txt("Saturno",sa[0]+24,sa[1]+4,"13px "+FONT,"#e6d3a0");
  const sp=P(M.sonda[i]), prv=P(M.sonda[Math.max(i-1,0)]), ang=Math.atan2(sp[1]-prv[1],sp[0]-prv[0]); if(i>0&&i<N-1||q<=0) probe(sp[0],sp[1],ang,1.1); else probe(sp[0],sp[1],ang,1.1);
  const bid=c.beats[beat].id; if(bid==="encuentro"||bid==="salto"){ const k=(tt*1.4)%1; g.beginPath(); g.arc(j[0],j[1],20+60*k,0,7); g.strokeStyle=`rgba(90,209,230,${.8*(1-k)})`; g.lineWidth=3; g.stroke(); }
  txt(fecha(0,q*M.t_saturno),32,H-76,"600 22px "+MONO,COL.text); txt("tamaños no a escala",32,106,"12px "+FONT,COL.mut);
  { const x0=60,x1=820,y=H-24; poly([[x0,y],[x1,y]],"rgba(160,180,250,.5)",3); const qJ=M.t_jupiter/M.t_saturno;
    [[0,"Lanzamiento · 3 sep 1977"],[qJ,"Júpiter · 12 abr 1979"],[1,"Saturno · 1 feb 1981"]].forEach(([qq,l],k)=>{ const xx=lerp(x0,x1,qq); dot(xx,y,6,qq<=q+1e-6?COL.probe:"#44507f"); txt(l,k===2?xx:(k===0?xx:xx),y-14,"600 14px "+FONT,qq<=q+1e-6?COL.text:COL.mut,k===2?"right":(k===0?"left":"center")); });
    poly([[x0,y],[lerp(x0,x1,q),y]],COL.probe,3); }
  // panel derecho
  const dT=M.dias; graph({x:880,y:100,w:380,h:300},{title:"Rapidez respecto al Sol (km/s)",x0:0,x1:M.t_saturno,y0:0,y1:45,xt:[0,300,600,900,1200],yt:[0,10,20,30,40],xlabel:"días desde el lanzamiento",
    bands:[],hlines:[],series:[{x:dT,y:M.rapidez,c:COL.probe,n:i+1}]});
  const S=M.resumen, cards=[["C3",fmt(S.C3,0)+" km²/s²"],["v∞ en Júpiter",fmt(S.vinf,2)+" km/s"],["periapsis",fmt(S.rp_RJ,2)+" R_J"],["ΔE heliocéntrica",fmt(S.dE,0)+" km²/s²"]];
  const show=bid==="titulo"||bid==="hohmann"?0:bid==="ida"?1:bid==="encuentro"?3:bid==="salto"?4:4;
  cards.forEach((cd,k)=>{ if(k<show){ const x=880+(k%2)*196, y=418+Math.floor(k/2)*78; panel(x,y,184,68); txt(cd[0],x+12,y+24,"13px "+FONT,COL.mut); txt(cd[1],x+12,y+52,"600 19px "+MONO,k===3?COL.chg:COL.text); } });
  if(bid==="salto"||bid==="vuelta"||bid==="resumen"||bid==="datos"){ const jv=22.237, y=(v)=>0; txt("11.6 → 22.2 km/s",1244,134,"700 16px "+FONT,COL.chg,"right"); }
  if(bid==="resumen"){ panel(880,418,380,160,"Comparación"); txt("Con asistencia: 3.42 años · C3 = 100",894,462,"500 17px "+FONT,COL.keep); txt("Hohmann directo: 6.05 años · C3 = 105.8",894,496,"500 17px "+FONT,"#ff9bb0"); txt("Menos tiempo y menos energía de lanzamiento",894,540,"14px "+FONT,COL.mut); }
}

/* ================= CLIP 2: ENCUENTRO ================= */
const VJ=12.816, VINF=9.844, RP=5.956*RJ, TH=120.05*Math.PI/180;
function geom2(){ const a=MU/(VINF*VINF), e=1+RP*VINF*VINF/MU, b=a*Math.sqrt(e*e-1), delta=2*Math.asin(1/e), sg=-1, phi=Math.acos(1/e), alpha=TH-sg*phi;
  const rot=(x,y)=>[x*Math.cos(alpha)-y*Math.sin(alpha),x*Math.sin(alpha)+y*Math.cos(alpha)];
  const rho=H=>rot(a*(e-Math.cosh(H)),sg*b*Math.sinh(H)), tf=H=>Math.sqrt(a**3/MU)*(e*Math.sinh(H)-H);
  const thOut=TH-delta, uin=[VINF*Math.cos(TH),VINF*Math.sin(TH)], uout=[VINF*Math.cos(thOut),VINF*Math.sin(thOut)];
  const dir=H=>{const v=rot(-a*Math.sinh(H),sg*b*Math.cosh(H));return Math.atan2(v[1],v[0]);};

  txt("maniobra",gr.X(V.maniobra_dias[0])+6,gr.T+16,"600 12px "+FONT,COL.probe);
  [["real",COL.probe],["Júpiter puntual",COL.chg],["modelo completo",COL.jup]].forEach(([k,cl],j)=>{ const lx=gr.L+8, ly=gr.B-58+j*17; poly([[lx,ly-4],[lx+20,ly-4]],cl,3); txt(k,lx+28,ly,"600 12px "+FONT,cl); });
  const errP=sw(V.puntual).map((p,k)=>Math.hypot(p[0]-sw(V.real)[k][0],p[1]-sw(V.real)[k][1])*RJ), errC=sw(V.completo).map((p,k)=>Math.hypot(p[0]-sw(V.real)[k][0],p[1]-sw(V.real)[k][1])*RJ);
  const emax=Math.max(...errP,...errC)*1.1;
  graph({x:880,y:366,w:380,h:234},{title:"Error de posición del modelo (km)",x0:-1.5,x1:1,y0:0,y1:emax,xt:[-1.5,-1,-.5,0,.5,1],yt:[0,Math.round(emax/3/100)*100,Math.round(emax*2/3/100)*100],yf:v=>String(Math.round(v)),xlabel:"días desde el periapsis",
    series:[{x:ds,y:errP,c:COL.chg,n:["puntual","maniobra","completo","cierre"].includes(bid)?n1:0,w:2.8,d:[7,5]},{x:ds,y:errC,c:COL.jup,n:["completo","cierre"].includes(bid)?n1:0,w:2.8}]});
}

/* ---------- despachador ---------- */
const CLIPS={mision:clipMision,encuentro:clipEncuentro,conservacion:clipCons,conicas:clipConicas,voyager:clipVoyager};
window.renderFrame=function(name,cfg,beat,tt,tAbs){
  const c=cfg[name], bd=c.beats[beat]; fondo(); twinkle(tAbs);
  if(beat===0){ tarjetaTitulo(c,tt); return; }
  const prog=bd.prog, u=clamp(tt/bd.dur,0,1), q=lerp(prog[0],prog[1],ease(u));
  cabecera(c.titulo); CLIPS[name](q,beat,tt,c);
};
